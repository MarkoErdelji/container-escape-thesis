# Lima VM for the workdir-escape scenario (lab-b).
# This VM IS the "host" the attacker tries to escape to. A successful escape
# compromises only this disposable VM, never macOS.
#
# CVE-2024-21626 (Leaky Vessels): runc < 1.1.12 leaks a host directory fd
# into the container. Setting workdir=/proc/self/fd/N causes the container to
# start with CWD on the host filesystem (runc resolves the path in host context).
#
# Requirements for the CVE to be reproducible:
#  - runc 1.1.11 (vulnerable: does not close the leaked fd before exec)
#  - containerd 1.7.12 (last release before the Jan-31-2024 CVE disclosure;
#    1.7.13+ closes the fd on the containerd side before runc sees it;
#    2.x additionally adds a time-namespace entry to OCI specs that runc 1.1.11
#    cannot handle, causing every container start to error out)
#
# containerd 1.7.12 is NOT in any distro apt repo anymore, so we download the
# official binary from GitHub and replace the distro containerd with it.
#
# Start:  limactl start --name=thesis-lab-b lima/lima-lab-b.yaml
# Shell:  limactl shell thesis-lab-b
# Stop/rm: limactl stop thesis-lab-b && limactl delete thesis-lab-b

vmType: vz
cpus: 2
memory: "4GiB"
disk: "20GiB"

images:
  - location: "https://cloud-images.ubuntu.com/releases/22.04/release/ubuntu-22.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/22.04/release/ubuntu-22.04-server-cloudimg-amd64.img"
    arch: "x86_64"

# Containment: mount ONLY the project dir, read-only, as /lab.
mounts:
  - location: "/Users/markoerdelji/Documents/thesisv2"
    mountPoint: "/lab"
    writable: false

# Disable Lima's built-in containerd/docker — we manage our own via apt.
containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      # docker.io brings dockerd, docker CLI, containerd, runc — all from Ubuntu repos.
      apt-get install -y docker.io auditd audispd-plugins jq curl xxd python3-pip

      ARCH="$(dpkg --print-architecture)"

      # Replace the distro containerd with the official 1.7.12 binary (released 2024-01-14,
      # 17 days before CVE-2024-21626 was disclosed). This version leaks the host directory fd
      # into runc without closing it first, which is the prerequisite for the workdir escape.
      mkdir -p /tmp/ct-extract
      curl -fsSL "https://github.com/containerd/containerd/releases/download/v1.7.12/containerd-1.7.12-linux-${ARCH}.tar.gz" \
        | tar -xz -C /tmp/ct-extract
      systemctl stop containerd docker 2>/dev/null || true
      install -m0755 /tmp/ct-extract/bin/containerd /usr/bin/containerd
      install -m0755 /tmp/ct-extract/bin/containerd-shim-runc-v2 /usr/bin/containerd-shim-runc-v2

      # Replace distro runc with the VULNERABLE runc 1.1.11.
      curl -fsSL -o /tmp/runc "https://github.com/opencontainers/runc/releases/download/v1.1.11/runc.${ARCH}"
      install -m0755 /tmp/runc /usr/sbin/runc
      install -m0755 /tmp/runc /usr/bin/runc

      systemctl enable --now docker
      containerd --version    # must report 1.7.12
      runc --version | head -1   # must report 1.1.11

      # Permissive ptrace so a host-root process (reached via the fd leak) can read sibling RAM.
      echo 'kernel.yama.ptrace_scope = 0' > /etc/sysctl.d/99-thesis-ptrace.conf
      sysctl --system

      systemctl enable --now auditd
      cat > /etc/audit/rules.d/thesis.rules <<'EOF'
      -a always,exit -F arch=b64 -S fork -S vfork -S clone -S execve -k thesis_proc
      -a always,exit -F arch=b64 -S openat -F dir=/proc -F perm=r -k thesis_procmem
      EOF
      augenrules --load || auditctl -R /etc/audit/rules.d/thesis.rules || true
  - mode: user
    script: |
      #!/bin/bash
      set -eux
      sudo usermod -aG docker "$USER" || true

message: |
  thesis-lab-b VM is up (containerd 1.7.12 + runc 1.1.11 / CVE-2024-21626, ptrace_scope=0).
  Build images and bring up the lab with:
    limactl shell thesis-lab-b -- bash /lab/scripts/lab.sh build
